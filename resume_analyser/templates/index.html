<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Resume Analyzer</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background: #f7f9fc;
        color: #20232a;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        margin: 0;
      }
      .container {
        background: #ffffff;
        border: 1px solid #e1e5eb;
        border-radius: 12px;
        box-shadow: 0 16px 40px rgba(15, 23, 42, 0.08);
        padding: 32px;
        width: min(420px, 90vw);
      }
      h1 {
        margin-top: 0;
        font-size: 1.8rem;
      }
      .subtitle {
        margin-top: 0.4rem;
        color: #5c6b77;
      }
      form {
        margin-top: 24px;
      }
      label {
        display: block;
        margin-bottom: 0.75rem;
        font-weight: 600;
      }
      input[type="file"] {
        width: 100%;
      }
      button {
        margin-top: 20px;
        width: 100%;
        padding: 13px 18px;
        border: none;
        border-radius: 8px;
        background: #2f80ed;
        color: white;
        font-size: 1rem;
        cursor: pointer;
      }
      button:hover {
        background: #1c6ed8;
      }
      .note {
        margin-top: 16px;
        color: #5c6b77;
        font-size: 0.95rem;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>AI Resume Analyzer</h1>
      <form action="/analyze" method="POST" enctype="multipart/form-data">
        <input type="file" name="resume" required>
        <br><br>
        <button type="submit">
          Analyze Resume
        </button>
      </form>
    </div>
  </body>
</html>
